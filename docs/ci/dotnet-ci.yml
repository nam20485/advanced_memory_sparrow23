name: .NET CI

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
      - name: Restore
        run: dotnet restore AdvancedMemory.sln
      - name: Build
        run: dotnet build AdvancedMemory.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test AdvancedMemory.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build GraphRagService image
        run: |
          docker build -t graphragservice:ci ./services/GraphRagService

