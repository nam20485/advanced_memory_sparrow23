version: '3.9'
services:
  apiservice:
    build:
      context: ./src/AdvancedMemory.Api
    ports:
      - "5080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - graphragservice
  graphragservice:
    build:
      context: ./services/GraphRagService
    ports:
      - "8001:8001"
